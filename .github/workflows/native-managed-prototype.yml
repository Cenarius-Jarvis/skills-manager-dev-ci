name: Native managed deployment prototype
on:
  push:
    branches: [codex/native-managed-executor]
    paths:
      - 'src-tauri/src/core/native_managed_executor.rs'
      - 'src-tauri/src/core/mod.rs'
      - '.github/workflows/native-managed-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install runner-only Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test managed target and metadata with temporary fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_deploy -- --test-threads=1
