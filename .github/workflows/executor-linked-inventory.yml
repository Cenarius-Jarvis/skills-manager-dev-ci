name: Executor linked inventory tests
on:
  push:
    branches: [codex/executor-explicit-link-roots]
    paths:
      - 'src-tauri/src/core/device_executor.rs'
      - 'src-tauri/src/bin/skills-manager-cli.rs'
      - '.github/workflows/executor-linked-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux runner build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test linked inventory and temporary Git channel
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib inventory_ -- --test-threads=1
      - name: Test repeatable CLI allowed roots
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin skills-manager-cli inventory_run_once_cli_accepts_repeated_explicit_roots
