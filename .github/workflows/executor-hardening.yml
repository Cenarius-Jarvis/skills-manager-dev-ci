name: Executor ownership hardening tests
on:
  push:
    branches: [codex/executor-ownership-hardening]
    paths:
      - 'src-tauri/src/core/device_executor.rs'
      - '.github/workflows/executor-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test executor in isolated temporary directories
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib core::device_executor::tests:: -- --test-threads=1
