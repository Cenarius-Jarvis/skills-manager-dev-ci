name: Test builds label 4 (Windows installer + Linux CLI)
# Deliberately narrow trigger, same scheme as two-device-simulation.yml:
# only pushes to this branch that touch this workflow file build, so a
# release is an explicit act — bump the build label below to cut a new
# preview. The artifact is a clearly labeled TEST build compiled with the
# test-build feature, so all its data lives in a suffixed directory and
# it never touches the production store or replaces the production install.
on:
  push:
    branches: [codex/device-identity-pairing]
    paths: ['.github/workflows/windows-test-build.yml']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows installer (isolated test build)
        run: npm run tauri:build -- --config src-tauri/tauri.test-build.conf.json --features test-build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-test-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux runner dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Linux packages (deb + AppImage, isolated test build)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          set -o pipefail
          npm run tauri:build -- --config src-tauri/tauri.test-build.conf.json --features test-build --bundles deb appimage 2>&1 | tee linux_build.log
      - name: Surface Linux build failures as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f linux_build.log ]; then
            if grep -q "^error" linux_build.log; then
              LOG=$(grep -E "^error" -A6 linux_build.log | tail -c 2600)
            else
              LOG=$(tail -c 2600 linux_build.log)
            fi
            LOG=${LOG//$'\n'/%0A}
            echo "::error::linux build errors: $LOG"
          fi
      - name: Build the Linux CLI binary
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin skills-manager-cli
      - name: Package the Linux CLI
        shell: bash
        run: |
          mkdir -p package
          cp src-tauri/target/release/skills-manager-cli package/
          tar -czf skills-manager-cli-linux.tar.gz -C package skills-manager-cli
      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-test-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-cli-linux
          path: skills-manager-cli-linux.tar.gz
          if-no-files-found: error
          retention-days: 14
