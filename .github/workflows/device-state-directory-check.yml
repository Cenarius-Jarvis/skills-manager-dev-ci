name: Device state and signed receipts
on:
  push:
    branches: [codex/signed-device-status, codex/device-skill-workspaces]
    paths:
      - 'src-tauri/**'
      - 'src/views/Devices.tsx'
      - 'src/components/Remote*.tsx'
      - 'src/components/DeviceWorkerSettings.tsx'
      - 'src/lib/tauri.ts'
      - 'src/i18n/**'
      - '.github/workflows/device-state-directory-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux runner libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test mismatched device state is rejected
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib channel_rejects_state_report_in_another_device_directory
      - name: Test unsigned remote execution remains blocked
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_executor_unsigned_live_run_is_disabled_before_state_creation
      - name: Test older state cannot overwrite newer inventory
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_state_older_or_equal_snapshot_cannot_replace_newer_inventory
      - name: Test device channel regression suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib core::devices::tests -- --test-threads=1
      - name: Test signed state inventory and guards
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_state -- --test-threads=1
      - name: Test report-state CLI guards
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin skills-manager-cli signed_state_cli -- --test-threads=1
      - name: Test legacy executor fixture regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_executor -- --test-threads=1
      - name: Test device page projection
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_page_ -- --test-threads=1
      - name: Test signed receipt projection across a Git channel
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_receipts::tests -- --test-threads=1
      - name: Test offline device repositories and publication
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_skill_mirror -- --test-threads=1
      - name: Test remote edit confinement
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_repository_edit -- --test-threads=1
      - name: Test legacy desktop startup on a copied configuration fixture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib upgrade_v10_retains_preset_skills_and_agent_deployments
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/views/Devices.test.tsx src/components/RemoteDeviceLibrary.test.tsx src/components/RemoteDeviceLibraryInventory.test.tsx src/components/RemoteSkillWorkspace.test.tsx
      - run: npm run build
      - run: node scripts/check-i18n.mjs

  packages:
    if: github.ref == 'refs/heads/codex/device-skill-workspaces'
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            suffix: .exe
            label: windows-x64
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            suffix: ''
            label: linux-amd64-appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the isolated desktop and matching CLI
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          CLI_SUFFIX: ${{ matrix.suffix }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --features test-build --bin skills-manager-cli
          cli="src-tauri/target/release/skills-manager-cli"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$("$cli$CLI_SUFFIX" --version | tr -d '\r')" = "skills-manager-cli $version"
          cp "$cli$CLI_SUFFIX" "$cli-$(rustc --print host-tuple)$CLI_SUFFIX"
          npm ci
          npm run tauri:build -- --features test-build --config src-tauri/tauri.test-build.conf.json --config src-tauri/tauri.upgrade-candidate.conf.json --bundles "$BUNDLE"
      - name: Check the packaged Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one isolated installer" }
          $dest = Join-Path $env:RUNNER_TEMP 'skills-manager-workspace-test'
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$dest" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $cli = Join-Path $dest 'skills-manager-cli.exe'
          $actual = & $cli --version
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "skills-manager-cli $version") { throw "CLI missing or wrong version" }
      - name: Check the packaged Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" = 1
          image=$(realpath "${images[0]}")
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract 'usr/bin/skills-manager-cli' >/dev/null)
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$("$RUNNER_TEMP/squashfs-root/usr/bin/skills-manager-cli" --version)" = "skills-manager-cli $version"
      - name: Upload the isolated package
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-workspace-test-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
