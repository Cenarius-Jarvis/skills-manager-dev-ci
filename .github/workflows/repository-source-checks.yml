name: Independent repository source checks
on:
  push:
    branches: [codex/repository-sources-readonly]
    paths:
      - 'src-tauri/src/core/repository_sources.rs'
      - 'src-tauri/src/core/skill_store.rs'
      - 'src-tauri/src/core/migrations.rs'
      - 'src-tauri/src/core/mod.rs'
      - 'src-tauri/src/commands/repository_sources.rs'
      - 'src-tauri/src/commands/mod.rs'
      - 'src-tauri/src/lib.rs'
      - '.github/workflows/repository-source-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install runner-only libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test isolated fake Git repository sources
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib repository_sources
      - name: Test database migrations
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib migrations
