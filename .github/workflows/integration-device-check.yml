name: Integrated device checks
on:
  push:
    branches: [codex/integration-v1.43.3]
    paths: ['.github/workflows/integration-device-check.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test integrated device views
        run: npx vitest run src/context/DeviceViewContext.test.tsx src/components/RemoteDeviceLibrary.test.tsx src/components/LocalInventoryPreview.test.tsx src/views/Devices.test.tsx
      - run: npm run build
      - run: node scripts/check-i18n.mjs
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test warning projection
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib device_page_preserves
      - name: Test local inventory
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib device_inventory
