name: Pinned-skill update simulation
on:
  push:
    branches: [codex/pinned-skill-update-fixture]
    paths: ['.github/workflows/two-device-simulation.yml']
permissions:
  contents: read
jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux runner dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify pinned installation, update, and signed round trip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib two_device_simulation -- --test-threads=1
      - name: Verify isolated native deployment protections
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_deploy -- --test-threads=1
      - name: Verify unsigned live execution remains disabled
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_executor_unsigned_live_run_is_disabled -- --test-threads=1
