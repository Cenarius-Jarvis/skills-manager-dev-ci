name: Device identity pairing and signed inbox validation
# Rust sources and this workflow file both retrigger CI; frontend-only
# changes do not. The test-build feature keeps preview installs out of the
# production data directory (see central_repo.rs).
on:
  push:
    branches: [codex/device-identity-pairing]
    paths: ['.github/workflows/two-device-simulation.yml', 'src-tauri/**']
permissions:
  contents: read
jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - name: Install Linux runner dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Every test step tees its output; the annotation step at the end
      # surfaces the tails anonymously (no login needed to read them back).
      - name: Start fixture git daemon
        shell: bash
        run: |
          mkdir -p /tmp/gitdaemon-root
          git daemon --port=9418 --listen=127.0.0.1 --reuseaddr --export-all --base-path=/tmp/gitdaemon-root > /tmp/gitdaemon.log 2>&1 &
          sleep 1
      - name: Verify device identity signing and pairing approval
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_identity -- --test-threads=1 2>&1 | tee identity_test.log
      - name: Verify signed command channel publication
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_channel -- --test-threads=1 2>&1 | tee signed_channel_test.log
      - name: Verify signed command execution and receipts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_signed_executor -- --test-threads=1 2>&1 | tee signed_executor_test.log
      - name: Verify durable signed inbox and restart recovery
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_pairing -- --test-threads=1 2>&1 | tee pairing_test.log
      - name: Verify signed round trip, updates, and abrupt process termination
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib two_device_simulation -- --test-threads=1 2>&1 | tee roundtrip_test.log
      - name: Verify isolated native deployment protections
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_deploy -- --test-threads=1 2>&1 | tee nativedeploy_test.log
      - name: Verify unsigned live execution remains disabled
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_executor_unsigned_live_run_is_disabled -- --test-threads=1 2>&1 | tee executor_test.log
      - name: Surface test failures as annotations
        if: failure()
        shell: bash
        run: |
          for f in identity_test.log signed_channel_test.log signed_executor_test.log pairing_test.log roundtrip_test.log nativedeploy_test.log executor_test.log; do
            [ -f "$f" ] || continue
            LOG=$(tail -c 2800 "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$f tail: $LOG"
          done
