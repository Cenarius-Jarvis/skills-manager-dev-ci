name: Test Build

# Manual test builds for verifying the feature branch on real machines:
# artifacts ONLY — never a Release, never code signing. This workflow lives
# on the CI verification mirror, not in the feature branch proposed upstream.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux-x64
          - platform: windows-latest
            label: Windows-x64
    runs-on: ${{ matrix.platform }}
    name: Test build (${{ matrix.label }})
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-user-dirs \
            xdg-utils

      # The CLI binary compiles without a frontend dist (tauri's
      # generate_context only reads the config, same as `cargo test`).
      - name: Build CLI binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin skills-manager-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-cli-${{ matrix.label }}
          path: |
            src-tauri/target/release/skills-manager-cli
            src-tauri/target/release/skills-manager-cli.exe
          if-no-files-found: error

      # Unsigned test bundle of the full app (NSIS installer on Windows).
      # createUpdaterArtifacts is disabled via config merge: the app's updater
      # pubkey demands a signing key that test builds deliberately do not have.
      # The version is bumped above the official release so a test install is
      # distinguishable in "About" and in Add/Remove Programs, and the updater
      # treats it as newer than official latest (no accidental downgrade).
      - name: Build app bundle (unsigned)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles nsis --config '{"version":"1.43.3-dev.1","bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload app bundle artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-app-Windows-x64-test
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
