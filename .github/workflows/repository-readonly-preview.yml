name: Build isolated repository preview
on:
  push:
    branches: [codex/repository-readonly-preview]
    paths: ['.github/workflows/repository-readonly-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Test shared repository component
        run: npx vitest run src/components/RepositorySources.test.tsx
      - name: Build preview interface
        run: npx vite build --config vite.repository-preview.config.ts
      - name: Test snapshot backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --features isolated-repo-preview --lib repository_sources -- --test-threads=1
      - name: Test preview temporary-store lifetime
        run: cargo test --manifest-path src-tauri/Cargo.toml --features isolated-repo-preview --bin repository-readonly-preview -- --test-threads=1
      - name: Build standalone preview
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features isolated-repo-preview --bin repository-readonly-preview
      - name: Verify executable checksum
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/repository-readonly-preview.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Preview executable missing' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe
      - name: Smoke test in clean hosted user profile
        shell: pwsh
        run: |
          $protected = @(
            (Join-Path $env:USERPROFILE '.skills-manager'),
            (Join-Path $env:USERPROFILE '.codex'),
            (Join-Path $env:USERPROFILE '.agents'),
            (Join-Path $env:USERPROFILE '.config/opencode'),
            (Join-Path $env:APPDATA 'skills-manager')
          )
          foreach ($path in $protected) {
            if (Test-Path -LiteralPath $path) { throw "Expected clean hosted fixture path: $path" }
          }
          $exe = (Resolve-Path -LiteralPath 'src-tauri/target/release/repository-readonly-preview.exe').Path
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Preview exited during startup: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id }
            }
          }
          foreach ($path in $protected) {
            if (Test-Path -LiteralPath $path) { throw "Preview created a protected fixture path: $path" }
          }
      - name: Prepare preview and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview-output | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/repository-readonly-preview.exe' -Destination preview-output
          Copy-Item -LiteralPath 'repository-preview/README.zh-CN.md' -Destination preview-output
      - uses: actions/upload-artifact@v4
        with:
          name: skills-repository-readonly-preview-windows
          path: preview-output/
          if-no-files-found: error
          retention-days: 14
