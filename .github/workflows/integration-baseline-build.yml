name: Integration baseline build
on:
  push:
    branches: [codex/integration-v1.43.3]
    paths: ['.github/workflows/integration-baseline-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build integrated frontend
        run: npm run build
      - name: Test Windows inventory guards
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib device_inventory
      - name: Compile integrated application
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin skills-manager
      - name: Verify binary exists
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/skills-manager.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Integrated application build missing' }
          Write-Host 'Compilation-only check; no installer or runnable artifact is published.'
