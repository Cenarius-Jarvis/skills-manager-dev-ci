name: Hardened Windows compile
on:
  push:
    branches: [codex/hardened-integration-candidate]
    paths: ['.github/workflows/hardened-windows-compile.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
          save-if: false
      - run: npm ci
      - name: Build integrated frontend
        run: npm run build
      - name: Compile full application without executing it
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin skills-manager
      - name: Verify binary exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'src-tauri/target/release/skills-manager.exe')) {
            throw 'Integrated executable was not produced'
          }
